# Real business vocabulary (swapped in 2026-08-27, replacing the
# contractor_for/channel_partner_of/distributor_for placeholders). Swap this
# list again whenever the vocabulary changes — nothing else in the
# extraction pipeline needs to change, since app/extraction/prompt.py reads
# this file at runtime and builds the direction guidance shown to the model
# from these fields.
#
# IMPORTANT: role (Consultant / OEM / End User) is NOT a stored property of
# an entity anywhere in this system - it's not an entity_type, not a column,
# not inferred across mentions. The same entity can be the OEM on one deal
# and the End User on another. Every relation type below describes a fact
# true only for that specific instance; direction is what the fact means as
# a two-place predicate (like works_at always having employee->employer),
# never an assumed hierarchy across Consultant/OEM/End-User as roles.
#
# Each entry needs:
#   name        - the exact relation_type string stored in the DB
#   description - states which side is source and which is target, in plain terms
#   example     - a concrete "A relation_type B" instance
relation_types:
  - name: refers
    description: >-
      A mentioned/introduced B to the speaker. This is the general referral
      relation covering the whole Consultant/OEM/End-User referral loop -
      any of these can refer any other, in any direction, and it varies
      case by case. Direction is purely who-mentioned-whom; it never
      implies a business hierarchy or that referrals only flow one way
      (e.g. an OEM referring a Consultant is just as valid as the reverse).
      A is the source (the referrer), B is the target (the one referred).
    example: "Thermo Engineering Systems refers ABC Consulting Engineers"

  - name: oem_for
    description: >-
      A is acting as the OEM (equipment integrator/supplier) relative to B
      for this specific deal - installing or integrating B's equipment.
      A is the source, B is the target. This describes A's role in this one
      instance only; it does not mean A is "an OEM" in general, and the
      same entity can appear as the OEM on one deal and in a different role
      on another.
    example: "Thermo Engineering Systems oem_for Sapcon Instruments"

  - name: end_user_of
    description: >-
      A is the end user of equipment supplied via B, for this specific
      deal. A is the source, B is the target - the entity that directly
      supplied A (which may be Sapcon Instruments itself or an
      intermediary). Always name the immediate supplier, never skip past
      an intermediary straight to Sapcon Instruments - preserving that
      chain is what lets us trace multi-hop paths through the network
      later.
    example: "Reliance Cement Ltd end_user_of Thermo Engineering Systems"

  - name: advisory_on
    description: >-
      A is listed as advisory on B's project, for this specific deal
      (usually Sapcon Instruments being named as the advisory party, but
      the relation itself doesn't require that). A is the source, B is the
      target - the project owner.
    example: "Sapcon Instruments advisory_on Reliance Cement Ltd"

  - name: consultant_on
    description: >-
      A is the consultant on B's project, for this specific deal. A is the
      source, B is the target - the project owner.
    example: "ABC Consulting Engineers consultant_on Reliance Cement Ltd"

  - name: works_at
    description: >-
      A (a person) is employed by, or is the owner/principal of, B (a
      company). A is the source, B is the target.
    example: "Rajesh Kumar works_at Indocem Engineering Pvt Ltd"

  - name: competitor_of
    description: >-
      A and B compete for the same customers. This is symmetric in
      meaning, but only extract the direction actually stated in the
      transcript - never add the mirrored fact yourself.
    example: "Rival Sensors Ltd competitor_of Sapcon Instruments"
