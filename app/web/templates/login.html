{% extends "base.html" %}
{% block title %}Sign in - Sapcon CRM{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>Sign in</h1>

{% if message %}<p class="flash">{{ message }}</p>{% endif %}

<form method="post" action="/login" class="stacked">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Phone number
    <input type="tel" name="phone" inputmode="tel" autocomplete="username"
           placeholder="98933 51932" required autofocus>
  </label>
  <label>PIN
    <input type="password" name="pin" inputmode="numeric" autocomplete="current-password"
           minlength="{{ min_pin }}" required>
  </label>
  <button type="submit">Sign in</button>
</form>

<p class="muted">No PIN yet? <a href="/enrol">Set one with a setup code</a>.</p>
{% endblock %}
