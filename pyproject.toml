[project]
name = "sapcon-crm"
version = "0.1.0"
description = "Personal relationship CRM for Sapcon Instruments field meetings"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.55",
    "rapidfuzz>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
