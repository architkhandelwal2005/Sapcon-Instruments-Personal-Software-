[project]
name = "sapcon-crm"
version = "0.1.0"
description = "Personal relationship CRM for Sapcon Instruments field meetings"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "rapidfuzz>=3.10",
    "jellyfish>=1.1",
    "python-dateutil>=2.9",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]
# sentence-transformers (local MiniLM embeddings) deferred until step 3 shows
# trigram + phonetic matching (jellyfish) actually misses matches it would catch —
# see PLAN.md "Flags on the cost policy" #2. Add it here if/when we need it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
